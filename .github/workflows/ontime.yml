name: ontime
# Starts FORGE's lock checks on time (see .github/scripts/ontime.py). A new copy starts every 4 hours and replaces the running one,
# so one is always waiting. Public repo: these minutes are free.
on:
  schedule:
    - cron: "40 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/ontime_now"]   # Claude commits this to start a copy now
concurrency: { group: ontime, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github, sparse-checkout-cone-mode: false }
      - env: { TOKEN: "${{ secrets.FORGE_DISPATCH_TOKEN }}" }
        run: python3 -u .github/scripts/ontime.py
